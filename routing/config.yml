graphhopper:
  datareader.file: /data/map.osm.pbf
  graph.location: /data/graph-cache

  graph.encoded_values: car_access, car_average_speed, road_class, surface, road_environment, max_speed, average_slope, max_slope

  # Elevation provider — SRTM tiles cached on disk. Required for the
  # frontend's elevation profile chart and any slope-aware routing.
  graph.elevation.provider: srtm
  graph.elevation.cache_dir: /data/elevation-cache
  graph.elevation.dataaccess: MMAP

  profiles:
    - name: motorcycle
      custom_model_files: [car.json]

    - name: motorcycle_curvy
      custom_model_files: [car.json, motorcycle_curvy.json]

  profiles_ch:
    - profile: motorcycle

  import.osm.ignored_highways: footway,cycleway,path,pedestrian,steps

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 0.0.0.0
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 0.0.0.0
