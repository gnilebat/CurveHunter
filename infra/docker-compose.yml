services:

  # ── Reverse proxy + tile server ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    # No host ports here. Local dev publishes :80 via docker-compose.override.yml;
    # production puts Caddy in front via docker-compose.prod.yml.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tiles:/var/tiles:ro              # place your .pmtiles file here
      - ../frontend/dist:/var/www:ro       # built frontend
    depends_on:
      - backend

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ../backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      GRAPHHOPPER_URL: http://graphhopper:8989
      GEOCODER_URL: http://photon:2322
      GEOCODER_LANG: de
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      graphhopper:
        condition: service_started

  # ── GraphHopper routing engine ───────────────────────────────────────────────
  graphhopper:
    build:
      context: ../routing
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/osm:/data                   # place map.osm.pbf here
      - graphhopper-cache:/data/graph-cache
      - elevation-cache:/data/elevation-cache
      - ../routing/config.yml:/graphhopper/config.yml:ro
      - ../routing/motorcycle_curvy.json:/graphhopper/motorcycle_curvy.json:ro
    environment:
      JAVA_OPTS: -Xmx10g -Xms2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Photon geocoder (autocomplete) ───────────────────────────────────────────
  # Serves a Germany-only Photon index that YOU build locally from current
  # Geofabrik data (see docker-compose.import.yml + GEOCODER.md), then push
  # here with scripts/push-geocoder.sh. No download/import at container start —
  # Photon just opens the index and serves. Starts in <60s.
  #
  # Bring up manually:  docker compose --profile geocoder up -d photon
  photon:
    build:
      context: ./photon
    restart: unless-stopped
    volumes:
      # Drop the pre-built Germany index here. The folder must directly
      # contain Photon's `node_1/` subdirectory.
      - ./photon-index:/photon/photon_data
    profiles: ["geocoder"]   # don't start with the default `docker compose up`
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2322/api?q=ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  graphhopper-cache:
  elevation-cache:
  # Note: the Photon index is a plain bind mount (./photon-index), not a named
  # volume — it's a build artifact you rsync in, not container-managed state.
