services:

  # ── Reverse proxy + tile server ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tiles:/var/tiles:ro              # place your .pmtiles file here
      - ../frontend/dist:/var/www:ro       # built frontend
    depends_on:
      - backend

  # ── FastAPI backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ../backend/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      GRAPHHOPPER_URL: http://graphhopper:8989
      GEOCODER_URL: http://photon:2322
      GEOCODER_LANG: de
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      graphhopper:
        condition: service_started

  # ── GraphHopper routing engine ───────────────────────────────────────────────
  graphhopper:
    build:
      context: ../routing
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./data/osm:/data                   # place map.osm.pbf here
      - graphhopper-cache:/data/graph-cache
      - elevation-cache:/data/elevation-cache
      - ../routing/config.yml:/graphhopper/config.yml:ro
      - ../routing/motorcycle_curvy.json:/graphhopper/motorcycle_curvy.json:ro
    environment:
      JAVA_OPTS: -Xmx10g -Xms2g
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8989/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ── Photon geocoder (autocomplete) ───────────────────────────────────────────
  # Uses komoot/photon's pre-built index (downloaded by an external script into
  # D:\Docker\photon_data). No import step at container start — Photon just
  # opens the ES index. Container is small and starts in <60s once the index
  # is on disk. Bring up manually with `docker compose up -d photon`.
  photon:
    image: rtuszik/photon-docker:latest
    restart: unless-stopped
    volumes:
      - photon-data:/photon/photon_data
    profiles: ["geocoder"]   # don't start with the default `docker compose up`
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2322/api?q=ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 90s

  # ── PostgreSQL + PostGIS ─────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  graphhopper-cache:
  elevation-cache:
  # Photon's ~12 GB Elasticsearch index lives at D:\Docker\photon_data — it's
  # extracted from the pre-built tarball downloaded from graphhopper.com.
  # The path inside the bind target must contain a `node_1/` subdirectory.
  photon-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: D:/Docker/photon_data
